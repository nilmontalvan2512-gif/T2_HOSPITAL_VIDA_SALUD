server:
  port: 8081

spring:
  application:
    name: patient-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:hospital_patients}
    username: ${DB_USER:hospital}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
